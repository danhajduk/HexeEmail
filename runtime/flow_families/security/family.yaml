schema_version: flow-family-config.v1
flow_family: security
output_schema_family: security
runtime_paths:
  template_dir: flow_families/security/templates
  probation_template_dir: flow_families/security/probation/templates
  probation_state_dir: flow_families/security/probation/state
  probation_evaluations_dir: flow_families/security/probation/evaluations
  probation_shadow_dir: flow_families/security/probation/shadow
  output_dir: flow_families/security/outputs
  reports_dir: flow_families/security/reports
heuristics:
  ignore_line_patterns:
    - ^\s*view (this )?(email|message) in your browser\s*$
    - ^\s*manage preferences\s*$
    - ^\s*unsubscribe\s*$
  stop_marker_patterns:
    - ^\s*privacy policy\s*$
    - ^\s*terms and conditions\s*$
    - ^\s*help center\s*$
  chrome_line_patterns:
    - ^\s*your account\s*$
    - ^\s*notification settings\s*$
    - ^\s*support center\s*$
  footer_cutoff_patterns:
    - copyright\s+\d{4}
    - privacy policy
    - terms and conditions
    - do not reply
  important_link_patterns:
    account: account|sign in|signin|review|secure|security
    document_action: report|alert|activity|download
    other: verify|confirm|reset|protect
  tracking_host_patterns:
    - /open|/track|/pixel
  filler_entity_patterns:
    - (?:&zwnj;|&nbsp;|&#8199;|&shy;|\u200c|\u00a0){3,}
  transactional_anchor_patterns:
    - security alert
    - suspicious activity
    - verify your identity
    - password reset
  promo_marker_patterns:
    - recommended for you
    - shop now
    - special offer
profiles:
  taxonomy_version: security-phase3-taxonomy.v1
  taxonomy:
    security_alert:
      profile_family: security
      profile_subtype: security_alert
      vendor_identity:
    suspicious_login:
      profile_family: security
      profile_subtype: suspicious_login
      vendor_identity:
    password_reset:
      profile_family: security
      profile_subtype: password_reset
      vendor_identity:
    identity_verification:
      profile_family: security
      profile_subtype: identity_verification
      vendor_identity:
    mfa_code:
      profile_family: security
      profile_subtype: mfa_code
      vendor_identity:
    new_device_login:
      profile_family: security
      profile_subtype: new_device_login
      vendor_identity:
    generic_security_notice:
      profile_family: security
      profile_subtype: generic_security_notice
      vendor_identity:
  known_vendor_identities:
    google.com: google
    microsoft.com: microsoft
    apple.com: apple
    paypal.com: paypal
    amazon.com: amazon
    example.com: example_vendor
  rules_override_path: flow_families/security/profile_rules.json
  rules:
    schema_version: security-phase3-rules.v1
    signals:
      security_alert_terms:
        - security alert
        - security notice
        - protect your account
        - account security
      suspicious_login_terms:
        - suspicious login
        - unusual sign-in
        - new sign in
        - unrecognized login
        - unusual activity
      password_reset_terms:
        - password reset
        - reset your password
        - password changed
        - change your password
      identity_verification_terms:
        - verify your identity
        - verify your account
        - identity verification
        - confirm your identity
      mfa_code_terms:
        - verification code
        - security code
        - one-time code
        - use this code
      new_device_login_terms:
        - new device
        - new browser
        - device login
        - signed in from
      generic_security_terms:
        - account protection
        - secure your account
        - review activity
        - sign-in alert
    sender_domain_profiles: {}
    weights:
      sender_match: 5
      security_alert_language: 8
      suspicious_login_language: 9
      password_reset_language: 8
      identity_verification_language: 9
      mfa_code_language: 9
      new_device_login_language: 8
      generic_security_language: 6
    thresholds:
      high_score: 14
      medium_score: 8
      max_score: 20
      min_confidence: 0.05
      min_confidence_after_downgrade: 0.2
    conflicts:
      pairs: []
      ignore_when_any_terms_present: []
      close_competing_score_gap: 2
      close_competing_confidence_penalty: 0.2
      conflicting_state_penalty: 0.15
validation_policy:
  url_field_suffixes:
    - _url
  identifier_fields:
    - alert_id
    - incident_id
    - verification_code
  identifier_min_length: 4
  success_threshold: 0.85
  partial_threshold: 0.5
  required_field_confidence_weight: 0.6
  valid_field_confidence_weight: 0.4
decision_policy:
  high_confidence_threshold: 0.85
  medium_confidence_threshold: 0.6
action_routing_policy:
  profile_intents:
    security_alert:
      - store_security_record
    suspicious_login:
      - store_security_record
    password_reset:
      - store_security_record
    identity_verification:
      - store_security_record
    mfa_code:
      - store_security_record
    new_device_login:
      - store_security_record
  decision_intents:
    accept:
      - user_notification
    review_needed:
      - user_notification
      - mark_for_manual_review
  diagnostic_token_intents: {}
  field_rules: []
