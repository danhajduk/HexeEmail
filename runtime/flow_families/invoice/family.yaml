schema_version: flow-family-config.v1
flow_family: invoice
output_schema_family: invoice
runtime_paths:
  template_dir: flow_families/invoice/templates
  probation_template_dir: flow_families/invoice/probation/templates
  probation_state_dir: flow_families/invoice/probation/state
  probation_evaluations_dir: flow_families/invoice/probation/evaluations
  probation_shadow_dir: flow_families/invoice/probation/shadow
  output_dir: flow_families/invoice/outputs
  reports_dir: flow_families/invoice/reports
heuristics:
  ignore_line_patterns:
    - ^\s*view (this )?(email|message) in your browser\s*$
    - ^\s*manage preferences\s*$
    - ^\s*unsubscribe\s*$
  stop_marker_patterns:
    - ^\s*privacy policy\s*$
    - ^\s*terms and conditions\s*$
    - ^\s*help center\s*$
  chrome_line_patterns:
    - ^\s*your account\s*$
    - ^\s*notification settings\s*$
    - ^\s*support center\s*$
  footer_cutoff_patterns:
    - copyright\s+\d{4}
    - privacy policy
    - terms and conditions
    - do not reply
  important_link_patterns:
    document_action: invoice|bill|payment|download|view|pdf|statement|receipt
    account: account|sign in|signin|review
  tracking_host_patterns:
    - /open|/track|/pixel
  filler_entity_patterns:
    - (?:&zwnj;|&nbsp;|&#8199;|&shy;|\u200c|\u00a0){3,}
  transactional_anchor_patterns:
    - invoice
    - billing statement
    - payment requested
    - receipt
  promo_marker_patterns:
    - recommended for you
    - shop now
    - special offer
profiles:
  taxonomy_version: invoice-phase3-taxonomy.v1
  taxonomy:
    invoice_ready:
      profile_family: invoice
      profile_subtype: invoice_ready
      vendor_identity:
    invoice_due:
      profile_family: invoice
      profile_subtype: invoice_due
      vendor_identity:
    receipt_issued:
      profile_family: invoice
      profile_subtype: receipt_issued
      vendor_identity:
    payment_confirmed:
      profile_family: invoice
      profile_subtype: payment_confirmed
      vendor_identity:
    overdue_billing_notice:
      profile_family: invoice
      profile_subtype: overdue_billing_notice
      vendor_identity:
    generic_invoice_update:
      profile_family: invoice
      profile_subtype: generic_invoice_update
      vendor_identity:
  known_vendor_identities:
    stripe.com: stripe
    paypal.com: paypal
    quickbooks.com: quickbooks
    intuit.com: intuit
    shopify.com: shopify
    example.com: example_vendor
  rules_override_path: flow_families/invoice/profile_rules.json
  rules:
    schema_version: invoice-phase3-rules.v1
    signals:
      invoice_ready_terms:
        - invoice is ready
        - your invoice is ready
        - invoice available
        - view invoice
      invoice_due_terms:
        - invoice due
        - payment requested
        - amount due
        - pay this invoice
        - due date
      receipt_issued_terms:
        - receipt
        - payment receipt
        - order receipt
        - receipt issued
      payment_confirmed_terms:
        - payment confirmed
        - payment successful
        - payment has been received
        - we received your payment
      overdue_billing_notice_terms:
        - overdue invoice
        - past due
        - overdue balance
        - late payment
      generic_invoice_terms:
        - billing statement
        - billing update
        - invoice update
        - account invoice
    sender_domain_profiles: {}
    weights:
      sender_match: 5
      invoice_ready_language: 8
      invoice_due_language: 9
      receipt_issued_language: 8
      payment_confirmed_language: 8
      overdue_billing_notice_language: 9
      generic_invoice_language: 6
    thresholds:
      high_score: 14
      medium_score: 8
      max_score: 20
      min_confidence: 0.05
      min_confidence_after_downgrade: 0.2
    conflicts:
      pairs: []
      ignore_when_any_terms_present: []
      close_competing_score_gap: 2
      close_competing_confidence_penalty: 0.2
      conflicting_state_penalty: 0.15
validation_policy:
  url_field_suffixes:
    - _url
  identifier_fields:
    - invoice_number
    - receipt_number
    - account_number
  identifier_min_length: 4
  success_threshold: 0.85
  partial_threshold: 0.5
  required_field_confidence_weight: 0.6
  valid_field_confidence_weight: 0.4
decision_policy:
  high_confidence_threshold: 0.85
  medium_confidence_threshold: 0.6
action_routing_policy:
  profile_intents:
    invoice_ready:
      - store_invoice_record
    invoice_due:
      - store_invoice_record
    receipt_issued:
      - store_invoice_record
    payment_confirmed:
      - store_invoice_record
    overdue_billing_notice:
      - store_invoice_record
  decision_intents:
    accept:
      - user_notification
    review_needed:
      - user_notification
      - mark_for_manual_review
  diagnostic_token_intents: {}
  field_rules: []
