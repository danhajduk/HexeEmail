schema_version: flow-family-config.v1
flow_family: shipment
output_schema_family: shipment
runtime_paths:
  template_dir: flow_families/shipment/templates
  probation_template_dir: flow_families/shipment/probation/templates
  probation_state_dir: flow_families/shipment/probation/state
  probation_evaluations_dir: flow_families/shipment/probation/evaluations
  probation_shadow_dir: flow_families/shipment/probation/shadow
  output_dir: flow_families/shipment/outputs
  reports_dir: flow_families/shipment/reports
heuristics:
  ignore_line_patterns:
    - ^\s*view (this )?(email|message) in your browser\s*$
    - ^\s*manage preferences\s*$
    - ^\s*unsubscribe\s*$
  stop_marker_patterns:
    - ^\s*privacy policy\s*$
    - ^\s*terms and conditions\s*$
    - ^\s*help center\s*$
  chrome_line_patterns:
    - ^\s*your account\s*$
    - ^\s*notification settings\s*$
    - ^\s*support center\s*$
  footer_cutoff_patterns:
    - copyright\s+\d{4}
    - privacy policy
    - terms and conditions
    - do not reply
  important_link_patterns:
    tracking_action: track|tracking|delivery|shipment
    document_action: label|receipt|document|download
    account: account|sign in|signin|review
  tracking_host_patterns:
    - /open|/track|/pixel
  filler_entity_patterns:
    - (?:&zwnj;|&nbsp;|&#8199;|&shy;|\u200c|\u00a0){3,}
  transactional_anchor_patterns:
    - tracking number
    - shipped
    - out for delivery
    - delivery update
  promo_marker_patterns:
    - recommended for you
    - shop now
    - special offer
profiles:
  taxonomy_version: shipment-phase3-taxonomy.v1
  taxonomy:
    shipped:
      profile_family: shipment
      profile_subtype: shipped
      vendor_identity:
    out_for_delivery:
      profile_family: shipment
      profile_subtype: out_for_delivery
      vendor_identity:
    delivered:
      profile_family: shipment
      profile_subtype: delivered
      vendor_identity:
    delayed:
      profile_family: shipment
      profile_subtype: delayed
      vendor_identity:
    label_created:
      profile_family: shipment
      profile_subtype: label_created
      vendor_identity:
    generic_shipment_update:
      profile_family: shipment
      profile_subtype: generic_shipment_update
      vendor_identity:
  known_vendor_identities:
    ups.com: ups
    fedex.com: fedex
    usps.com: usps
    dhl.com: dhl
    amazon.com: amazon
    example.com: example_vendor
  rules_override_path: flow_families/shipment/profile_rules.json
  rules:
    schema_version: shipment-phase3-rules.v1
    signals:
      shipped_terms:
        - has shipped
        - shipped
        - your package is on the way
        - shipment is on the way
      out_for_delivery_terms:
        - out for delivery
        - arriving today
        - delivery today
      delivered_terms:
        - delivered
        - package delivered
        - delivered at
      delayed_terms:
        - delivery delayed
        - shipment delayed
        - running late
        - exception in transit
      label_created_terms:
        - label created
        - shipment information sent
        - awaiting carrier pickup
      generic_shipment_terms:
        - tracking number
        - delivery update
        - shipment update
        - track your package
    sender_domain_profiles: {}
    weights:
      sender_match: 5
      shipped_language: 8
      out_for_delivery_language: 9
      delivered_language: 9
      delayed_language: 8
      label_created_language: 7
      generic_shipment_language: 6
    thresholds:
      high_score: 14
      medium_score: 8
      max_score: 20
      min_confidence: 0.05
      min_confidence_after_downgrade: 0.2
    conflicts:
      pairs: []
      ignore_when_any_terms_present: []
      close_competing_score_gap: 2
      close_competing_confidence_penalty: 0.2
      conflicting_state_penalty: 0.15
validation_policy:
  url_field_suffixes:
    - _url
  identifier_fields:
    - tracking_number
    - shipment_id
    - carrier_reference
  identifier_min_length: 4
  success_threshold: 0.85
  partial_threshold: 0.5
  required_field_confidence_weight: 0.6
  valid_field_confidence_weight: 0.4
decision_policy:
  high_confidence_threshold: 0.85
  medium_confidence_threshold: 0.6
action_routing_policy:
  profile_intents:
    shipped:
      - store_shipment_record
    out_for_delivery:
      - store_shipment_record
    delivered:
      - store_shipment_record
    delayed:
      - store_shipment_record
    label_created:
      - store_shipment_record
  decision_intents:
    accept:
      - user_notification
    review_needed:
      - user_notification
      - mark_for_manual_review
  diagnostic_token_intents: {}
  field_rules: []
