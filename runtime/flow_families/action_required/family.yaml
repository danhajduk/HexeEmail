    thresholds:
      high_score: 14
      medium_score: 8
      max_score: 20
      min_confidence: 0.05
      min_confidence_after_downgrade: 0.2
    conflicts:
      pairs: []
      ignore_when_any_terms_present: []
      close_competing_score_gap: 2
      close_competing_confidence_penalty: 0.2
      conflicting_state_penalty: 0.15
validation_policy:
  url_field_suffixes:
    - _url
    - _action
  identifier_fields:
    - action_id
    - document_id
  identifier_min_length: 4
  success_threshold: 0.85
  partial_threshold: 0.5
  required_field_confidence_weight: 0.6
  valid_field_confidence_weight: 0.4
decision_policy:
  high_confidence_threshold: 0.9
  medium_confidence_threshold: 0.65
action_routing_policy:
  profile_intents: {}
  decision_intents:
    accept:
      - store_action_record
      - user_notification
    probation:
      - mark_for_manual_review
    review_needed:
      - user_notification
      - mark_for_manual_review
  diagnostic_token_intents:
    important_inconsistency:
      - mark_high_priority
      - mark_for_manual_review
    deadline:
      - queue_reminder
  field_rules: []
