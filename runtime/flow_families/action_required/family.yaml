schema_version: flow-family-config.v1
flow_family: action_required
output_schema_family: action_required
runtime_paths:
  template_dir: flow_families/action_required/templates
  probation_template_dir: flow_families/action_required/probation/templates
  probation_state_dir: flow_families/action_required/probation/state
  probation_evaluations_dir: flow_families/action_required/probation/evaluations
  probation_shadow_dir: flow_families/action_required/probation/shadow
  output_dir: flow_families/action_required/outputs
  reports_dir: flow_families/action_required/reports
heuristics:
  ignore_line_patterns:
    - ^\s*view (this )?(email|message) in your browser\s*$
    - ^\s*manage (preferences|email preferences)\s*$
    - ^\s*unsubscribe\s*$
  stop_marker_patterns:
    - ^\s*privacy policy\s*$
    - ^\s*terms and conditions\s*$
    - ^\s*help center\s*$
  chrome_line_patterns:
    - ^\s*your account\s*$
    - ^\s*notification settings\s*$
    - ^\s*support center\s*$
  footer_cutoff_patterns:
    - copyright\s+\d{4}
    - privacy policy
    - terms and conditions
    - do not reply
  important_link_patterns:
    account: verify|confirm|sign|review|pay|resolve|reset
    document_action: invoice|receipt|document|statement|pdf
    other: account|sign in|signin|security
  tracking_host_patterns:
    - /open|/track|/pixel
  filler_entity_patterns:
    - (?:&zwnj;|&nbsp;|&#8199;|&shy;|\u200c|\u00a0){3,}
  transactional_anchor_patterns:
    - action required
    - payment due
    - verify your account
    - signature required
    - confirm your
    - deadline
  promo_marker_patterns:
    - recommended for you
    - buy again
    - shop now
    - new features
